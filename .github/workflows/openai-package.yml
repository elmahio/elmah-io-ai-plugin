name: OpenAI plugin package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build OpenAI plugin ZIP
        run: node scripts/build-openai-zip.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: elmah-io-openai-plugin
          path: dist/*.zip
